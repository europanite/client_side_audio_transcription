services:
  frontend_test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: frontend_test
    working_dir: /app
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - ./reports/frontend:/reports/frontend
    command: >-
      sh -lc "mkdir -p /reports/frontend && printf 'Jest docker test reports\n' > /reports/frontend/README.txt && npm ci && npm test -- --ci --runInBand --coverage --verbose --coverageDirectory=/reports/frontend/coverage --json --outputFile=/reports/frontend/jest-results.json"
